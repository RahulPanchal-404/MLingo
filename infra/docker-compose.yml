services:
  postgres:
    image: postgres:17
    container_name: mlingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlingo
      POSTGRES_USER: mlingo
      POSTGRES_PASSWORD: mlingo_dev_password
    ports:
      - "127.0.0.1:5432:5432"  # local only; the dev password is in this public repo
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: