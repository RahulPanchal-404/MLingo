# Render Blueprint: deploys the MLingo API and web app as two services.
# Render → New → Blueprint → pick this repo and branch.
# The two values marked `sync: false` are asked for when the Blueprint is created.

services:
  - type: web
    name: mlingo-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MLINGO_ENVIRONMENT
        value: production
      # The web service's URL, no trailing slash, e.g. https://mlingo-web.onrender.com
      - key: MLINGO_FRONTEND_ORIGIN
        sync: false
      - key: MLINGO_TUTOR_PROVIDER
        value: fallback
      # Optional: set MLINGO_TUTOR_PROVIDER=gemini and add a key in the dashboard
      - key: MLINGO_TUTOR_API_KEY
        sync: false

  - type: web
    name: mlingo-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked in at build time. The API's URL + /api/v1,
      # e.g. https://mlingo-api.onrender.com/api/v1. Changing it requires a redeploy.
      - key: NEXT_PUBLIC_API_URL
        sync: false
